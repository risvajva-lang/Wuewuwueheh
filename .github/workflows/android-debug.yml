name: CineView Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Gradle Wrapper Permissions
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

          ls -la ./gradlew 2>/dev/null || true
          ls -la ./android/gradlew 2>/dev/null || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate source tree
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Run repository source audit
        shell: bash
        run: |
          set -e

          if [ -f "./scripts/source-audit.sh" ]; then
            chmod +x ./scripts/source-audit.sh
            ./scripts/source-audit.sh
          else
            echo "No source-audit script found; continuing."
          fi

      - name: Run Kotlin and Java sanity checks
        shell: bash
        run: |
          set -e

          find app/src/main -type f \( \
            -name "*.kt" -o \
            -name "*.java" \
          \) -print

      - name: Gradle environment
        shell: bash
        run: |
          set -e
          ./gradlew --version

      - name: Unit tests
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK found:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -f "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -e

          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            | tee app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineView-VIP-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
